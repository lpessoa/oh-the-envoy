# Namespace where the Gateway and Route are created.
namespace: envoy-experiment

# Name of this Gateway instance.
gatewayName: inbound-gateway

# GatewayClass to use. Assumes the Envoy Gateway controller + this
# GatewayClass are already installed on the cluster (see repo README).
gatewayClassName: envoy
createGatewayClass: false

listener:
  port: 443
  # Envoy Gateway names the proxy container port after the listener:
  # <protocol>-<port>. The stable proxy Service targets it by name.
  portName: https-443

# mTLS at the ingress. Both Secrets are created by `make deploy-infra` from
# the git-ignored .certs/ directory (see scripts/gen-certs.sh):
#   certSecretName  kubernetes.io/tls Secret with the server cert/key
#   caSecretName    Secret with ca.crt used to validate client certificates
tls:
  certSecretName: inbound-gateway-tls
  caSecretName: inbound-gateway-ca

# Hostname all routes match. The demo sends "Host: inbound.local".
hostname: "inbound.local"

# One HTTPRoute per entry. requireJWT: true adds the route to the JWT
# SecurityPolicy's targetRefs; false leaves it open (token minting must be
# reachable without a token).
routes:
  - name: route-auth
    pathPrefix: /auth
    backend:
      name: token-service
      port: 8080
    requireJWT: false
  - name: route-a
    pathPrefix: /a
    backend:
      name: service-a
      port: 8080
    requireJWT: true
  - name: route-c
    pathPrefix: /c
    backend:
      name: service-c
      port: 8080
    requireJWT: true

# JWT validation settings enforced by the Envoy proxy for protected routes.
jwt:
  issuer: http://token-service.envoy-experiment.svc.cluster.local:8080
  audience: envoy-experiment
  jwksURI: http://token-service.envoy-experiment.svc.cluster.local:8080/auth/jwks.json
# Local (per-Envoy-instance) rate limiting, keyed by client-certificate CN
# (via the x-forwarded-client-cert header set by the ClientTrafficPolicy —
# see the mTLS multi-cert client identity feature). `routes` lists which
# route names (from the `routes` list above) this policy targets. Leave
# empty to disable rate limiting entirely.
rateLimit:
  routes:
    - route-a
    - route-c
  perClient:
    - cn: alice
      requestsPerMinute: 10
    - cn: bob
      requestsPerMinute: 10
  defaultRequestsPerMinute: 5
