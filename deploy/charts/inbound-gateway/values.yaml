# Namespace where the Gateway and Route are created.
namespace: envoy-experiment

# Name of this Gateway instance.
gatewayName: inbound-gateway

# GatewayClass to use. Assumes the Envoy Gateway controller + this
# GatewayClass are already installed on the cluster (see repo README).
gatewayClassName: envoy
createGatewayClass: false

listener:
  port: 80

# Hostname all routes match. The demo sends "Host: inbound.local".
hostname: "inbound.local"

# One HTTPRoute per entry. requireJWT: true adds the route to the JWT
# SecurityPolicy's targetRefs; false leaves it open (token minting must be
# reachable without a token).
routes:
  - name: route-auth
    pathPrefix: /auth
    backend:
      name: token-service
      port: 8080
    requireJWT: false
  - name: route-a
    pathPrefix: /a
    backend:
      name: service-a
      port: 8080
    requireJWT: true
  - name: route-c
    pathPrefix: /c
    backend:
      name: service-c
      port: 8080
    requireJWT: true

# JWT validation settings enforced by the Envoy proxy for protected routes.
jwt:
  issuer: http://token-service.envoy-experiment.svc.cluster.local:8080
  audience: envoy-experiment
  jwksURI: http://token-service.envoy-experiment.svc.cluster.local:8080/auth/jwks.json
