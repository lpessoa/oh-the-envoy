# Namespace where the Gateway and Route are created.
namespace: envoy-experiment

# Name of this Gateway instance.
gatewayName: outbound-gateway

# GatewayClass to use. Assumes the Envoy Gateway controller + this
# GatewayClass are already installed on the cluster (see repo README).
gatewayClassName: envoy
createGatewayClass: false

listener:
  port: 80

# Backend (service-d) this gateway routes gRPC traffic to.
backend:
  name: service-d
  port: 9000

# gRPC methods routed by the egress gateway, one GRPCRoute rule each. Both
# currently target the same backend but are independently reconfigurable.
grpcMethods:
  - service: chain.v1.ChainService
    method: Process
  - service: chain.v1.ChainService
    method: ProcessDirect

# :authority (Host) value clients must dial with for the GRPCRoute to match
# and forward to service-d. service-b sets this via grpc.WithAuthority(...).
hostname: "service-d.internal"
