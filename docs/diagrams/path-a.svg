      <animate attributeName="d" dur="12000ms" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.440;0.485;1" keySplines="0 0 1 1; 0.22 1 0.36 1; 0 0 1 1" values="M 410 324 L 412 324; M 410 324 L 412 324; M 410 324 L 556 324; M 410 324 L 556 324"/>
    </path>
    <text class="ev-msg-label" x="483" y="318" text-anchor="middle">gRPC Process (direct)</text>
    <animate attributeName="opacity" dur="12000ms" repeatCount="indefinite" calcMode="spline" values="0;0;1;1;0;0" keyTimes="0;0.440;0.470;0.925;0.950;1" keySplines="0 0 1 1; 0.22 1 0.36 1; 0 0 1 1; 0.4 0 1 1; 0 0 1 1"/>
  </g>
  <g data-role="message" data-seq="6">
    <path class="ev-msg" d="M 560 354 L 726 354">
