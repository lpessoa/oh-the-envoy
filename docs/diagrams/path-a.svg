    </path>
    <text class="ev-msg-label" x="647" y="438" text-anchor="middle">ChainResponse</text>
    <animate attributeName="opacity" dur="12000ms" repeatCount="indefinite" calcMode="spline" values="0;0;1;1;0;0" keyTimes="0;0.640;0.670;0.945;0.970;1" keySplines="0 0 1 1; 0.22 1 0.36 1; 0 0 1 1; 0.4 0 1 1; 0 0 1 1"/>
  </g>
  <g data-role="message" data-seq="10">
