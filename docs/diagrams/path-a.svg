<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" preserveAspectRatio="xMidYMid meet" data-role="sequence">
  <title>Path A — /a/hello request sequence</title>
  <desc>Over a mutual-TLS connection the client mints a token, then calls /a/hello with a Bearer
  token. The inbound gateway validates the JWT: a missing or invalid token short-circuits with 401,
  a valid one descends through service-a and service-b to the outbound gateway and service-d over
  gRPC Process, then the ChainResponse climbs back while a hops chip accumulates each service.</desc>
  <style>
/* EV-TOKENS:START */
:root {
  /* Surfaces and ink */
  --ev-bg: #020817; /* near-black slate canvas */
  --ev-surface: #191426; /* plum lift over the canvas; diagram surface */
  --ev-surface-2: #221b3e; /* second elevation step (gateway bodies) */
  --ev-border: #29272a; /* hairlines, rules */
  --ev-grid: #302a4d; /* outlines on surfaces */
  --ev-ink: #f8fafc; /* foreground text */
  --ev-muted: #94a3b8; /* muted / annotation text */

  /* Brand violet: identity and structure (the Envoy gateways) */
  --ev-primary: #6d28d9;
  --ev-primary-bright: #9867e4;
  --ev-primary-soft: #2a2246; /* neutral / soft node fill */
  --ev-primary-soft-stroke: #7c6ac4; /* neutral / soft node stroke */

  /* Highlight: the security beat — JWT validation, token minting, "look here" */
  --ev-highlight: #f6a723;
  --ev-highlight-soft: #4a3410;

  /* Diagram roles */
  --ev-role-a: #10b981; /* client (external source) */
  --ev-role-a-stroke: #34d39a;
  --ev-role-b: #38bdf8; /* application services (a / b / c / d) */
  --ev-role-b-stroke: #7dd3fc;
  --ev-role-c: #f472b6; /* token-service / auth support plane (JWKS) */
  --ev-neutral: #8992aa; /* passive actor */

  /* Flow */
  --ev-flow: #a8a1cf; /* request arrows and connectors */
  --ev-flow-strong: #f1edff; /* emphasized flow */

  /* Typography */
  --ev-font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --ev-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
  --ev-fs-title: 20px;
  --ev-fs-label: 13px;
  --ev-fs-mono: 12px;

  /* Geometry (unitless values are SVG user units) */
  --ev-radius: 8px;
  --ev-radius-sm: 5px;
  --ev-stroke: 1.5;
  --ev-stroke-strong: 2.5;
  --ev-node-w: 120;
  --ev-node-h: 48;
  --ev-gap: 24;

  /* Timing */
  --ev-dur: 1200ms;
  --ev-ease: cubic-bezier(0.22, 1, 0.36, 1);
}
/* EV-TOKENS:END */
    text { text-rendering: geometricPrecision; stroke: none; }
    .ev-canvas { fill: var(--ev-surface); stroke: var(--ev-grid); stroke-width: var(--ev-stroke); }
    .ev-title { font-family: var(--ev-font); font-size: var(--ev-fs-title); font-weight: 600; fill: var(--ev-ink); }
    .ev-label { font-family: var(--ev-font); font-size: var(--ev-fs-label); font-weight: 600; fill: var(--ev-ink); }
    .ev-mono { font-family: var(--ev-mono); font-size: var(--ev-fs-mono); fill: var(--ev-muted); }
    .ev-node { fill: var(--ev-primary-soft); stroke: var(--ev-primary-soft-stroke); stroke-width: var(--ev-stroke); }
    .ev-node--a { fill: var(--ev-role-a); stroke: var(--ev-role-a-stroke); }
    .ev-node--b { fill: var(--ev-role-b); stroke: var(--ev-role-b-stroke); }
    .ev-node--a .ev-label, .ev-node--b .ev-label { fill: var(--ev-surface); }
    .ev-lifeline { stroke: var(--ev-grid); stroke-width: var(--ev-stroke); stroke-dasharray: 3 6; }
    .ev-msg { fill: none; stroke: var(--ev-flow); stroke-width: var(--ev-stroke); marker-end: url(#ev-head); }
    .ev-msg--res { stroke-dasharray: 6 4; }
    .ev-msg--sc { fill: none; stroke: var(--ev-highlight); stroke-width: var(--ev-stroke-strong); stroke-dasharray: 6 4; marker-end: url(#ev-head-amber); }
    .ev-msg-label { font-family: var(--ev-mono); font-size: var(--ev-fs-mono); fill: var(--ev-muted); }
    .ev-msg-label--sc { fill: var(--ev-highlight); }
    .ev-note { fill: var(--ev-highlight-soft); stroke: var(--ev-highlight); stroke-width: var(--ev-stroke); }
    .ev-note-label { font-family: var(--ev-font); font-size: var(--ev-fs-label); font-weight: 600; fill: var(--ev-ink); }
    .ev-hops-title { font-family: var(--ev-mono); font-size: var(--ev-fs-mono); fill: var(--ev-muted); }
    .ev-hops-chip { fill: var(--ev-primary-soft); stroke: var(--ev-primary-soft-stroke); stroke-width: var(--ev-stroke); }
    .ev-hops-label { font-family: var(--ev-mono); font-size: var(--ev-fs-mono); fill: var(--ev-ink); }
    .ev-head { fill: var(--ev-flow); }
    .ev-head-amber { fill: var(--ev-highlight); }
    .ev-hop { fill: none; stroke: var(--ev-flow-strong); stroke-width: var(--ev-stroke-strong); opacity: 0; animation: ev-hop 12000ms var(--ev-ease) infinite; }
    @keyframes ev-hop { 0% { opacity: 0; } 2% { opacity: 0.9; } 10% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ev-hop { animation: none; opacity: 0; }
      [data-role="message"], [data-role="short-circuit"], [data-role="jwt-gate"], .ev-hops-step { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="ev-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ev-head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <marker id="ev-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ev-head-amber" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="ev-canvas" x="1" y="1" width="998" height="618" rx="14"/>
  <text class="ev-title" x="40" y="46">Path A — /a/hello</text>

  <!-- Lifelines -->
  <line class="ev-lifeline" data-role="lifeline" data-actor="client" x1="90" y1="110" x2="90" y2="556"/>
  <line class="ev-lifeline" data-role="lifeline" data-actor="gw" x1="250" y1="110" x2="250" y2="556"/>
  <line class="ev-lifeline" data-role="lifeline" data-actor="a" x1="410" y1="110" x2="410" y2="556"/>
  <line class="ev-lifeline" data-role="lifeline" data-actor="b" x1="560" y1="110" x2="560" y2="556"/>
  <line class="ev-lifeline" data-role="lifeline" data-actor="egw" x1="730" y1="110" x2="730" y2="556"/>
  <line class="ev-lifeline" data-role="lifeline" data-actor="d" x1="900" y1="110" x2="900" y2="556"/>

  <!-- Lifeline headers -->
  <g class="ev-node ev-node--a"><rect x="30" y="64" width="120" height="46" rx="8"/><text class="ev-label" x="90" y="92" text-anchor="middle">client</text></g>
  <g class="ev-node"><rect x="175" y="64" width="150" height="46" rx="8"/><text class="ev-label" x="250" y="92" text-anchor="middle">inbound-gateway</text></g>
  <g class="ev-node ev-node--b"><rect x="350" y="64" width="120" height="46" rx="8"/><text class="ev-label" x="410" y="92" text-anchor="middle">service-a</text></g>
  <g class="ev-node ev-node--b"><rect x="500" y="64" width="120" height="46" rx="8"/><text class="ev-label" x="560" y="92" text-anchor="middle">service-b</text></g>
  <g class="ev-node"><rect x="655" y="64" width="150" height="46" rx="8"/><text class="ev-label" x="730" y="92" text-anchor="middle">outbound-gateway</text></g>
  <g class="ev-node ev-node--b"><rect x="840" y="64" width="120" height="46" rx="8"/><text class="ev-label" x="900" y="92" text-anchor="middle">service-d</text></g>

  <!-- Arrival pulse: each actor lights up as traffic lands on it -->
  <g data-role="arrivals">
    <rect class="ev-hop" x="175" y="64" width="150" height="46" rx="8" style="animation-delay: 1020ms"/>
    <rect class="ev-hop" x="30" y="64" width="120" height="46" rx="8" style="animation-delay: 1620ms"/>
    <rect class="ev-hop" x="175" y="64" width="150" height="46" rx="8" style="animation-delay: 2220ms"/>
    <rect class="ev-hop" x="350" y="64" width="120" height="46" rx="8" style="animation-delay: 5220ms"/>
    <rect class="ev-hop" x="500" y="64" width="120" height="46" rx="8" style="animation-delay: 5820ms"/>
    <rect class="ev-hop" x="655" y="64" width="150" height="46" rx="8" style="animation-delay: 6420ms"/>
    <rect class="ev-hop" x="840" y="64" width="120" height="46" rx="8" style="animation-delay: 7020ms"/>
    <rect class="ev-hop" x="655" y="64" width="150" height="46" rx="8" style="animation-delay: 7620ms"/>
    <rect class="ev-hop" x="500" y="64" width="120" height="46" rx="8" style="animation-delay: 8220ms"/>
    <rect class="ev-hop" x="350" y="64" width="120" height="46" rx="8" style="animation-delay: 8820ms"/>
    <rect class="ev-hop" x="175" y="64" width="150" height="46" rx="8" style="animation-delay: 9420ms"/>
    <rect class="ev-hop" x="30" y="64" width="120" height="46" rx="8" style="animation-delay: 10020ms"/>
  </g>

  <!-- Messages -->
  <g data-role="message" data-seq="1">
    <path class="ev-msg" d="M 90 136 L 246 136">
      <animate attributeName="d" dur="12000ms" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.040;0.085;1" keySplines="0 0 1 1; 0.22 1 0.36 1; 0 0 1 1" values="M 90 136 L 92 136; M 90 136 L 92 136; M 90 136 L 246 136; M 90 136 L 246 136"/>
    </path>
    <text class="ev-msg-label" x="168" y="130" text-anchor="middle">POST /auth/token</text>
    <animate attributeName="opacity" dur="12000ms" repeatCount="indefinite" calcMode="spline" values="0;0;1;1;0;0" keyTimes="0;0.040;0.070;0.900;0.925;1" keySplines="0 0 1 1; 0.22 1 0.36 1; 0 0 1 1; 0.4 0 1 1; 0 0 1 1"/>
  </g>
  <g data-role="message" data-seq="2">
