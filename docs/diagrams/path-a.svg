  </g>
  <g data-role="message" data-seq="3">
    <path class="ev-msg" d="M 90 200 L 246 200">
      <animate attributeName="d" dur="12000ms" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.140;0.185;1" keySplines="0 0 1 1; 0.22 1 0.36 1; 0 0 1 1" values="M 90 200 L 92 200; M 90 200 L 92 200; M 90 200 L 246 200; M 90 200 L 246 200"/>
    </path>
    <text class="ev-msg-label" x="168" y="194" text-anchor="middle">POST /a/hello · Bearer</text>
    <animate attributeName="opacity" dur="12000ms" repeatCount="indefinite" calcMode="spline" values="0;0;1;1;0;0" keyTimes="0;0.140;0.170;0.910;0.935;1" keySplines="0 0 1 1; 0.22 1 0.36 1; 0 0 1 1; 0.4 0 1 1; 0 0 1 1"/>
  </g>

  <!-- JWT validation beat -->
  <g data-role="jwt-gate">
    <rect class="ev-note" x="158" y="210" width="184" height="26" rx="6"/>
    <text class="ev-note-label" x="250" y="227" text-anchor="middle">validate JWT · JWKS</text>
    <animate attributeName="opacity" dur="12000ms" repeatCount="indefinite" calcMode="spline" values="0;0;1;1;0;0" keyTimes="0;0.185;0.215;0.915;0.940;1" keySplines="0 0 1 1; 0.22 1 0.36 1; 0 0 1 1; 0.4 0 1 1; 0 0 1 1"/>
  </g>
  <!-- 401 short-circuit branch (transient) -->
  <g data-role="short-circuit">
    <path class="ev-msg--sc" d="M 250 262 L 94 262">
      <animate attributeName="d" dur="12000ms" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.230;0.275;1" keySplines="0 0 1 1; 0.22 1 0.36 1; 0 0 1 1" values="M 250 262 L 248 262; M 250 262 L 248 262; M 250 262 L 94 262; M 250 262 L 94 262"/>
    </path>
    <text class="ev-msg-label ev-msg-label--sc" x="172" y="256" text-anchor="middle">401 · missing/invalid token</text>
    <animate attributeName="opacity" dur="12000ms" repeatCount="indefinite" calcMode="spline" values="0;0;1;1;0;0" keyTimes="0;0.230;0.260;0.320;0.350;1" keySplines="0 0 1 1; 0.22 1 0.36 1; 0 0 1 1; 0.4 0 1 1; 0 0 1 1"/>
  </g>

  <g data-role="message" data-seq="4">
    <path class="ev-msg" d="M 250 294 L 406 294">
      <animate attributeName="d" dur="12000ms" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.390;0.435;1" keySplines="0 0 1 1; 0.22 1 0.36 1; 0 0 1 1" values="M 250 294 L 252 294; M 250 294 L 252 294; M 250 294 L 406 294; M 250 294 L 406 294"/>
    </path>
    <text class="ev-msg-label" x="328" y="288" text-anchor="middle">POST /a/hello (HTTP/2)</text>
