    </path>
    <text class="ev-msg-label" x="643" y="348" text-anchor="middle">gRPC Process · :authority</text>
    <animate attributeName="opacity" dur="12000ms" repeatCount="indefinite" calcMode="spline" values="0;0;1;1;0;0" keyTimes="0;0.490;0.520;0.930;0.955;1" keySplines="0 0 1 1; 0.22 1 0.36 1; 0 0 1 1; 0.4 0 1 1; 0 0 1 1"/>
  </g>
  <g data-role="message" data-seq="7">
    <path class="ev-msg" d="M 730 384 L 896 384">
